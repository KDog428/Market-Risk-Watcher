<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Risk Watcher</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <main class="container">

        <h1>Market Risk Watcher</h1>

        <p class="subtitle">
            Search a market ticker to view price and risk information.
        </p>

        <div class="search-box">
            <input
                id="tickerInput"
                type="text"
                placeholder="Enter ticker, e.g. AAPL"
            >

            <button id="searchButton">
                Search
            </button>
        </div>

        <p id="errorMessage"></p>

        <section id="assetSection" class="hidden">

            <h2 id="assetTitle"></h2>

            <div class="cards">

                <div class="card">
                    <span>Close</span>
                    <strong id="close"></strong>
                </div>

                <div class="card">
                    <span>Daily Return</span>
                    <strong id="dailyReturn"></strong>
                </div>

                <div class="card">
                    <span>20-Day Average</span>
                    <strong id="movingAverage"></strong>
                </div>

                <div class="card">
                    <span>20-Day Volatility</span>
                    <strong id="volatility20"></strong>
                </div>

                <div class="card">
                    <span>60-Day Volatility</span>
                    <strong id="volatility60"></strong>
                </div>

            </div>

            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

        </section>

    </main>

    <script src="app.js"></script>
    <section class="bond-section">

        <h2>Bond Explorer</h2>
    
        <p>
            Filter bond ETFs by category and compare their risk characteristics.
        </p>
    
        <div class="bond-filters">
            <button class="bond-filter active" data-type="all">
                All
            </button>
    
            <button class="bond-filter" data-type="treasury">
                Treasury
            </button>
    
            <button class="bond-filter" data-type="corporate">
                Corporate
            </button>
    
            <button class="bond-filter" data-type="high-yield">
                High Yield
            </button>
    
            <button class="bond-filter" data-type="aggregate">
                Aggregate
            </button>
    
            <button class="bond-filter" data-type="green">
                Green
            </button>
        </div>
    
        <div id="bondList" class="bond-grid"></div>
    
    </section>
    <section class="comparison-section">

        <h2>Compare Bonds</h2>
    
        <div class="comparison-controls">
    
            <select id="bondA">
                <option value="">Select first bond</option>
            </select>
    
            <span>vs</span>
    
            <select id="bondB">
                <option value="">Select second bond</option>
            </select>
    
            <button id="compareButton">
                Compare
            </button>
    
        </div>
    
        <div id="comparisonResult" class="hidden">
    
            <div id="comparisonCards"></div>
    
            <div class="chart-container">
                <canvas id="comparisonChart"></canvas>
            </div>
    
        </div>
    
    </section>

</body>
</html>
